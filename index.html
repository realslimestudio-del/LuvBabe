<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuvBabe</title></head>
<body style="margin:0;background:#120b0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<iframe id="app" style="border:0;width:100%;height:100vh;display:block"></iframe>
<script>
(function(){
  var frame=document.getElementById('app');
  var CLOUD='https://mantledb.sh/v2/luv-babe-fdf1a72c430003fba7f4e922e0d00283/accounts';
  function loadAccounts(){return fetch(CLOUD,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('โหลดบัญชีไม่สำเร็จ');return r.json()}).then(function(d){return Array.isArray(d)?d:(d&&Array.isArray(d.accounts)?d.accounts:[])});}
  function saveAccounts(list){return fetch(CLOUD,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({accounts:list})}).then(function(r){if(!r.ok)throw new Error('บันทึกบัญชีไม่สำเร็จ');return true});}
  function randomString(n){var s='',c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
  function ensureRecovery(){return loadAccounts().then(function(list){for(var i=0;i<list.length;i++)if(list[i]&&list[i].username==='admin_recovery')return null;var pass=randomString(12);list.push({username:'admin_recovery',password:pass,role:'admin',allowedTabs:['dashboard','sales','customers','staffs','reports','settings']});return saveAccounts(list).then(function(){return {username:'admin_recovery',password:pass};});});}
  function makeId(list){var n=1;while(list.some(function(x){return x&&x.username==='friend'+String(n).padStart(2,'0')}))n++;return 'friend'+String(n).padStart(2,'0');}
  function copy(t){return navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject(new Error('คัดลอกไม่ได้'));}
  function installFriendButton(doc){
    if(!doc)return;var add=doc.getElementById('loveb-add-user-btn');if(!add||doc.getElementById('loveb-create-friend-btn'))return;
    var btn=doc.createElement('button');btn.id='loveb-create-friend-btn';btn.type='button';btn.textContent='💗 สร้าง ID ให้เพื่อนอัตโนมัติ';btn.style.cssText='width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid #ff4d8d;background:transparent;color:#ff7aaa;font-weight:600;font-size:13px;cursor:pointer;';
    var result=doc.createElement('div');result.id='loveb-friend-result';result.style.cssText='display:none;margin-top:10px;border:1px solid #3a2630;border-radius:10px;padding:10px;background:#21171d;font-size:12px;color:#f5dce6;';add.parentNode.appendChild(btn);add.parentNode.appendChild(result);
    btn.onclick=function(){btn.disabled=true;btn.textContent='กำลังสร้าง ID...';loadAccounts().then(function(list){var id=makeId(list),pass=randomString(10),tabs=[],checks=doc.querySelectorAll('.loveb-new-tab-chk:checked');for(var i=0;i<checks.length;i++)tabs.push(checks[i].value);list.push({username:id,password:pass,role:'partner',allowedTabs:tabs});return saveAccounts(list).then(function(){var link=window.location.origin+window.location.pathname+'?id='+encodeURIComponent(id);result.style.display='block';result.innerHTML='<div style="font-weight:700;color:#ff8bb5;margin-bottom:6px">✅ สร้าง ID ให้เพื่อนแล้ว</div><div>🆔 ID: <b>'+id+'</b></div><div>🔑 รหัสผ่าน: <b>'+pass+'</b></div><div style="word-break:break-all;margin-top:4px">🔗 ลิงก์: <span>'+link+'</span></div><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button id="copy-friend" style="padding:7px 9px;border:0;border-radius:7px;background:#ff4d8d;color:#fff">คัดลอก ID/รหัส</button><button id="copy-link" style="padding:7px 9px;border:1px solid #ff4d8d;background:transparent;color:#ff9abe">คัดลอกลิงก์</button></div>';doc.getElementById('copy-friend').onclick=function(){copy(id+'\n'+pass).then(function(){alert('คัดลอก ID และรหัสผ่านแล้ว')})};doc.getElementById('copy-link').onclick=function(){copy(link).then(function(){alert('คัดลอกลิงก์แล้ว')})};alert('สร้าง ID ให้เพื่อนสำเร็จ\nID: '+id+'\nรหัสผ่าน: '+pass);});}).catch(function(e){result.style.display='block';result.textContent='❌ '+e.message}).finally(function(){btn.disabled=false;btn.textContent='💗 สร้าง ID ให้เพื่อนอัตโนมัติ'});};
    var friendId=new URLSearchParams(window.location.search).get('id');if(friendId){var input=doc.getElementById('loveb-auth-user');if(input)input.value=friendId;}
  }
  function install(doc){installFriendButton(doc);}
  function boot(){frame.src='index%20(1).html'+(window.location.search||'');frame.addEventListener('load',function(){try{var doc=frame.contentDocument||frame.contentWindow.document;install(doc);if(doc.documentElement){var obs=new MutationObserver(function(){install(doc)});obs.observe(doc.documentElement,{subtree:true,childList:true});}}catch(e){}});}
  ensureRecovery().catch(function(){}).then(boot);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=20260908-22',{scope:'./'}).then(function(reg){return reg.update()}).catch(function(){});}
})();
</script>
</body>
</html>
