name: Build Lovebabe Windows Installer
on:
  push:
    branches: [main, lovebabe-windows-installer]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare app
        shell: pwsh
        run: Copy-Item -LiteralPath 'index (1).html' -Destination 'desktop/app.html' -Force
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lovebabe-Setup
          path: desktop/dist/Lovebabe-Setup.exe
          if-no-files-found: error
